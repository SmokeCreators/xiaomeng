<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>霍晓萌 · Huo Xiaomeng</title>
<style>
:root{
  --bg:#0a0a12; --panel:#141720; --bar:#1d1f2b; --line:#2a2d3a; --dim:#6a6d7a; --text:#c9ccd8;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"PingFang SC","Microsoft YaHei","Noto Sans Mono CJK SC",monospace;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html,body{height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--mono);font-size:13px;display:flex;justify-content:center}
.win{width:100%;max-width:760px;height:100%;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:10px}
.bar{display:flex;align-items:center;gap:8px;background:var(--bar);padding:10px 14px;border-bottom:1px solid var(--line);flex:none}
.bar i{width:11px;height:11px;border-radius:50%;display:block}
.bar i:nth-child(1){background:#ff5f57}.bar i:nth-child(2){background:#febc2e}.bar i:nth-child(3){background:#28c840}
.bar b{font-weight:400;color:var(--dim);font-size:12px;margin-left:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero{flex:1;min-height:0;background:#000;position:relative;display:flex;justify-content:center;cursor:pointer;touch-action:manipulation}
canvas{height:100%;width:auto;max-width:100%;display:block}
.cap{position:absolute;left:0;right:0;bottom:16px;text-align:center;pointer-events:none}
.cap h1{margin:0;font-size:clamp(28px,8vw,46px);letter-spacing:.14em;color:#fff;min-height:1.3em;text-shadow:0 0 18px rgba(255,79,154,.6);animation:glow 4s ease-in-out infinite}
.cap p{margin:2px 0 0;color:var(--dim);font-size:12px;opacity:0;transition:opacity 1.2s}
.cap p.on{opacity:1}
.cur{display:inline-block;width:.5em;height:1em;background:#fff;vertical-align:text-bottom;margin-left:4px;animation:b 1s steps(2) infinite}
@keyframes b{50%{opacity:0}}
@keyframes glow{50%{text-shadow:0 0 30px rgba(167,123,255,.85),0 0 6px rgba(90,162,255,.5)}}
.status{flex:none;display:flex;justify-content:space-between;gap:10px;background:var(--bar);color:var(--dim);font-size:12px;padding:6px 14px;border-top:1px solid var(--line)}
.hero:focus-visible{outline:2px solid #a77bff;outline-offset:-2px}
@media (prefers-reduced-motion:reduce){.cur,.cap h1{animation:none}}
</style>
</head>
<body>
<main class="win">
  <div class="bar"><i></i><i></i><i></i><b>xiaomeng.py — Renderer.convert() + draw()</b></div>
  <div class="hero" id="hero" tabindex="0" role="img" aria-label="用字符绘制的一束花，点击绽放">
    <canvas id="cv" width="720" height="760"></canvas>
    <div class="cap"><h1 id="nm" aria-label="霍晓萌"></h1><p id="sub">Huo Xiaomeng · 石家庄</p></div>
  </div>
  <div class="status"><span>石家庄 <span id="clk"></span></span><span id="hint">点一下，花会绽放</span></div>
</main>
<script>
(function(){
  var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
  var COLS=64,ROWS=60,W=cv.width,H=cv.height,cw=W/COLS,ch=H/ROWS;
  var SETS=['.,\'`','-:;~','=+<>/\\','*|!(){}','#%&$QO','@MW8B'];
  var flowers=[
    {x:32,y:16,r:11,h:326,p:0},{x:17,y:27,r:8.5,h:268,p:1.3},
    {x:48,y:26,r:9,h:212,p:2.1},{x:31,y:33,r:7,h:350,p:.6},{x:41,y:19,r:6,h:292,p:3}
  ];
  var MOUTH={x:32,y:42},reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function hash(a,b){var s=Math.sin(a*127.1+b*311.7)*43758.5453;return s-Math.floor(s)}
  function segDist(px,py,ax,ay,bx,by){
    var dx=bx-ax,dy=by-ay,t=Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy)));
    return Math.hypot(px-ax-t*dx,py-ay-t*dy);
  }
  var pulse=0,sway=0,swayT=0,parts=[],stars=[],i;
  for(i=0;i<70;i++)stars.push({x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS),p:Math.random()*6,c:['.','+','*','·'][i%4]});
  function sample(x,y,t){
    var best=null,f,k,i;
    if(y>=44&&y<=58){
      var u=(y-44)/14,hw=5+7*Math.sin(Math.PI*Math.min(1,u*1.15))+(u>.85?-2:0),d=Math.abs(x-32);
      if(d<hw){var e=1-d/hw;best={v:.25+.55*(1-e)+.15*Math.sin(y*.9+x*.3-t*1.5),h:250+u*40+Math.sin(t+y*.2)*8,s:.55}}
    }
    for(i=0;i<flowers.length;i++){
      f=flowers[i];
      if(y>f.y&&y<=MOUTH.y+3){
        var sx=f.x+sway*(1-y/60)*(f.y<30?1:.8),sd=segDist(x,y,f.x+sway*2*(1-f.y/60),f.y,MOUTH.x+(i-2)*1.2,MOUTH.y+3);
        if(sd<.75&&(!best||best.v<.5))best={v:.5,h:140,s:.6};
      }
    }
    var lf=[[22,35,6,2.2,-.6],[43,34,6.5,2.2,.7],[28,40,5,1.8,-.3],[38,40,5,1.8,.4]];
    for(i=0;i<4;i++){
      var L=lf[i],ang=L[4]+Math.sin(t*1.2+i)*.12,ca=Math.cos(ang),sa=Math.sin(ang),dx=x-L[0],dy=y-L[1];
      var rx=(dx*ca+dy*sa)/L[2],ry=(-dx*sa+dy*ca)/L[3],q=rx*rx+ry*ry;
      if(q<1&&(!best||best.v<.55))best={v:.35+.4*(1-q),h:135+rx*10,s:.55};
    }
    for(i=0;i<flowers.length;i++){
      f=flowers[i];
      var fx=f.x+sway*2*(1-f.y/60),dx2=x-fx,dy2=(y-f.y)*1.15;
      var breath=1+.06*Math.sin(t*1.6+f.p)+pulse*.22;
      var d2=Math.hypot(dx2,dy2),a=Math.atan2(dy2,dx2)+t*.25*(i%2?1:-1)+pulse*2;
      var rr=f.r*breath*(.74+.26*Math.cos(6*a+f.p*2)*Math.cos(a*2+f.p));
      if(d2<rr){
        k=d2/rr;
        var v=.3+.7*(.35+.65*Math.abs(Math.sin(k*9-a*3+f.p+t*.8)));
        if(k<.18)v=.95;
        best={v:v,h:f.h+k*30-15+Math.sin(t*.7+f.p)*14+pulse*40,s:.85};
      }
    }
    return best;
  }
  function spawn(x,y,n,burst){
    for(var j=0;j<n;j++){
      var a=Math.random()*6.283,sp=burst?.5+Math.random()*1.6:0;
      parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp*.7-(burst?.4:0),h:[326,268,212,350,292][j%5],c:'*o~+.'.charAt(j%5),w:Math.random()*6,life:0});
    }
  }
  var start=0,raf=0,last=0,drift=0;
  function frame(now){
    if(!start){start=now;last=now}
    var dt=Math.min(.05,(now-last)/1000);last=now;
    var t=(now-start)/1000,fall=reduce?1:Math.min(1,t/3.6);
    var ease=1-Math.pow(1-fall,3),off=(1-ease)*-52;
    sway+=((swayT)-sway)*.06;
    if(!reduce)sway+=Math.sin(t*.9)*.01;
    pulse*=.94;
    drift+=dt;
    if(fall>=1&&!reduce&&drift>.18){drift=0;var f=flowers[Math.floor(Math.random()*5)];spawn(f.x+(Math.random()-.5)*f.r,f.y+f.r*.5,1,false)}
    ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
    ctx.font=(ch*.98)+'px ui-monospace,Menlo,Consolas,monospace';ctx.textBaseline='top';
    // stars
    for(i=0;i<stars.length;i++){
      var s=stars[i],tw=.5+.5*Math.sin(t*1.4+s.p);
      ctx.fillStyle='rgba(180,190,255,'+(.08+.3*tw)+')';ctx.fillText(s.c,s.x*cw,s.y*ch);
    }
    // thread
    var tipY=flowers[0].y-flowers[0].r+off;
    ctx.fillStyle='rgba(160,160,190,.45)';
    for(var yy=0;yy<tipY;yy++)ctx.fillText(yy%2?'|':':',31.5*cw,yy*ch);
    // bouquet
    for(var y=0;y<ROWS;y++){
      var sy=y-off;
      if(sy<0||sy>=ROWS+2)continue;
      for(var x=0;x<COLS;x++){
        var sm=sample(x,sy,t);
        if(!sm)continue;
        var v=Math.max(0,Math.min(1,sm.v*(.9+.1*Math.sin(t*2+x*.7+y*.5))));
        var lvl=Math.min(5,Math.floor(v*6)),set=SETS[lvl];
        var c=set.charAt(Math.floor(hash(x,y+Math.floor(t*2.2*(lvl>3?0:1)))*set.length));
        ctx.fillStyle='hsl('+Math.round(sm.h)+','+Math.round(sm.s*100)+'%,'+(28+v*46)+'%)';
        ctx.fillText(c,x*cw,y*ch);
      }
    }
    // petals
    for(i=parts.length-1;i>=0;i--){
      var p=parts[i];p.life+=dt;
      p.vy+=dt*.9;p.vx*=.985;p.x+=p.vx*dt*12+Math.sin(t*2+p.w)*.05;p.y+=p.vy*dt*12;
      var a=Math.max(0,1-p.life/7);
      if(p.y>ROWS||a<=0){parts.splice(i,1);continue}
      ctx.fillStyle='hsla('+p.h+',85%,65%,'+a+')';ctx.fillText(p.c,p.x*cw,p.y*ch);
    }
    raf=requestAnimationFrame(frame);
  }
  function play(){cancelAnimationFrame(raf);start=0;parts=[];pulse=0;raf=requestAnimationFrame(frame);type()}
  var hero=document.getElementById('hero');
  function gridPos(e){var r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*COLS,y:(e.clientY-r.top)/r.height*ROWS}}
  hero.addEventListener('pointermove',function(e){var g=gridPos(e);swayT=Math.max(-1,Math.min(1,(g.x-32)/32))*2.4});
  hero.addEventListener('pointerleave',function(){swayT=0});
  hero.addEventListener('click',function(e){
    var g=gridPos(e);if(isNaN(g.x))g={x:32,y:25};
    pulse=1;spawn(Math.max(2,Math.min(62,g.x)),Math.max(2,Math.min(55,g.y)),46,true);
  });
  hero.addEventListener('keydown',function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();pulse=1;spawn(32,22,46,true)}});
  // typed name
  var nm=document.getElementById('nm'),sub=document.getElementById('sub'),txt='霍晓萌',tt=0;
  function type(){
    clearTimeout(tt);sub.classList.remove('on');nm.innerHTML='<span class="cur"></span>';
    if(reduce){nm.textContent=txt;sub.classList.add('on');return}
    var n=0;tt=setTimeout(function step(){
      n++;nm.innerHTML=txt.slice(0,n)+'<span class="cur"></span>';
      if(n<txt.length)tt=setTimeout(step,420);else sub.classList.add('on');
    },2400);
  }
  // clock in Shijiazhuang
  var clk=document.getElementById('clk');
  function tick(){try{clk.textContent=new Date().toLocaleTimeString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false})}catch(e){}}
  tick();setInterval(tick,1000);
  play();
})();
</script>
</body>
</html>
